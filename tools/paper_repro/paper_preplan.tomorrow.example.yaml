paper_key: REPLACE_PAPER_KEY    # e.g. bypass_cache, pcal, etc.
title: "REPLACE: Full paper title (Authors — Conference Year)"
target_branch: hrl/paper/REPLACE_PAPER_KEY-repro-v0
paper_source: "REPLACE: path or note, e.g. docs/papers/REPLACE_PAPER_KEY.pdf"

mechanism_category: REPLACE_ME  # warp_scheduler | cache_replacement | prefetch | other

expected_modules:
  - src/gpgpu-sim/shader.h
  - src/gpgpu-sim/shader.cc
  # add as needed: gpu-sim.cc, gpu-cache.h, gpu-cache.cc

# Guideline: 5–7 rounds for most papers; never exceed 8 without human approval
max_rounds: 6

stage_sequence:
  - 00_reading
  - 01_noop
  - 02_telemetry
  - 03_would_change
  - 04_minimal_mechanism
  - 05_focused_validation
  # 06_standard_validation  — skip unless paper requires trend verification
  - 07_final_report

allowed_auto_stages:
  - 00_reading
  - 01_noop
  - 02_telemetry
  - 03_would_change       # OK to run; stop_after_completion=true for review
  - 07_final_report

require_review_stages:
  - 04_minimal_mechanism  # ALWAYS — first real behavior change
  - 05_focused_validation # cycle direction must match paper (or document mismatch)
  - 06_standard_validation

known_approximations:
  - description: "REPLACE: e.g. no loop detection; global scope instead of per-loop"
    impact: "REPLACE: e.g. triggers on non-loop code paths"
    fix_direction: "REPLACE: e.g. implement back-edge detection in CFG"

success_criteria:
  # Core targets — faithful reproduction NOT required
  faithful_reproduction: false
  approximate_reproduction: true
  mechanism_chain_reproduced: true   # signal → decision → gate: all three must work
  feature_off_cycle_unchanged: true  # NON-NEGOTIABLE
  feature_on_signal_present: true    # paper_<key>_* stats non-zero on focused workloads
  no_deadlock: true
  focused_validation_complete: true  # 5–7 workloads, 3 configs (off/would/on)
  final_report_created: true

stop_rules:
  - feature_off_sim_cycle_changed     # hard stop — breaks baseline invariant
  - deadlock_or_hang                  # hard stop — workload never finishes
  - timeout_per_stage_10min           # soft stop — output checkpoint, pause
  - unexpected_modules_touched        # hard stop — scope creep
  - scope_creep_detected              # hard stop — Claude expanding beyond stage

# After each milestone, create a git tag before continuing
version_control_plan:
  base_branch: hrl/paper/REPLACE_PAPER_KEY-repro-v0
  tag_each_milestone: true
  milestone_tags:
    - REPLACE_PAPER_KEY-config-noop
    - REPLACE_PAPER_KEY-telemetry
    - REPLACE_PAPER_KEY-would-change
    - REPLACE_PAPER_KEY-minimal-mechanism
    - REPLACE_PAPER_KEY-focused-validation
    - REPLACE_PAPER_KEY-final-report

final_report_policy:
  create_report_doc: true            # docs/papers/<key>_final_reproduction_report.md
  update_round_state: true
  update_CLAUDE_md: true
  do_not_continue_mechanism_refinement: true
  # After final_report, stop paper branch work entirely
  recommend_next_branch: hrl/idea/cache-policy-experiments-v0
