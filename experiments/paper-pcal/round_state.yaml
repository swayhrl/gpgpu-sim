paper: pcal
round: Phase 1
stage: noop_config
status: complete
date: 2026-05-01
branch: hrl/paper/pcal-repro-v0

source_changed: true
experiments_run: true
workloads_run: [vecadd, rodinia_hotspot, rodinia_srad_v2]
feature_off_unchanged: true
feature_on_noop_unchanged: true
paper_pcal_stats_zero: true
recommend_next: Phase 2
commit_recommended: true
suggested_commit: "pcal: add no-op config and stats"

# 论文机制链（从 Phase 0 保留）
mechanism_chain:
  - name: miss-rate probe
    description: "per-warp L1D miss / access count in sliding window"
    stage: 02_telemetry
    hook_location: "shader.cc hot path (L1D access path)"
    approximation: "global access count not split by instruction type"
  - name: priority classification
    description: "miss_rate > threshold → low priority → bypass"
    stage: 03_would_change
    hook_location: "shader.cc: per-warp classification check"
    approximation: "per-warp binary classification; no per-CTA or per-PC"
  - name: L1 bypass gate
    description: "low-priority warp loads bypass L1D, go directly to ICNT"
    stage: 04_minimal_mechanism
    hook_location: "shader.cc: bypassL1D condition"
    approximation: "only L1D bypass; L2 bypass not implemented"

# GPGPU-Sim 映射点
gpgpu_sim_mapping:
  - file: src/gpgpu-sim/shader.h
    purpose: "per-warp miss/access counters; miss_rate array; config knobs"
  - file: src/gpgpu-sim/shader.cc
    purpose: "miss probe hook; bypass decision; access tracking"
  - file: src/gpgpu-sim/gpu-sim.cc
    purpose: "option_parser_register for knobs; stat output"
  - file: src/gpgpu-sim/gpu-cache.h
    purpose: "read-only reference: cache_operator_type (CACHE_GLOBAL, CACHE_ALL)"

# Phase 1 实现的 knobs（7 个，全部默认 off）
implemented_knobs:
  - gpgpu_enable_pcal          # default 0
  - gpgpu_pcal_enable_telemetry  # default 0
  - gpgpu_pcal_enable_would_bypass  # default 0
  - gpgpu_pcal_enable_bypass       # default 0
  - gpgpu_pcal_miss_rate_threshold  # default 50
  - gpgpu_pcal_window_size         # default 64
  - gpgpu_pcal_debug               # default 0

# Phase 1 实现的 stats（9 个，行为计数默认 0）
implemented_stats:
  - paper_pcal_enabled
  - paper_pcal_miss_event
  - paper_pcal_access_event
  - paper_pcal_warp_classified_high
  - paper_pcal_warp_classified_low
  - paper_pcal_would_bypass
  - paper_pcal_bypass_count
  - paper_pcal_bypass_hit
  - paper_pcal_window_reset

# 近似说明（从 reading stage 保留）
approximation_notes:
  - "per-warp (not per-CTA) classification"
  - "simple miss/access ratio (not full CSI metric)"
  - "only L1D bypass (no L2 bypass)"
  - "binary priority (not multi-level)"
  - "fixed window size (not adaptive)"

# 分支说明
branch_note: "分支从 hrl/paper/daws-repro-v0 创建（含 CCWS+DAWS instrumentation）。所有旧 feature flag 默认 0/off，不影响 PCAL baseline 验证。"
