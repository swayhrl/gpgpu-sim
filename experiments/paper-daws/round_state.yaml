deadlock_fix_summary: >
  Root cause: footprint array updated post-scoreboard; gated warps never
  reached update → stale footprint → permanent gate.
  Fix 1: added daws_update_footprint_pre() called pre-scoreboard using
  read-only get_active_mask() to refresh footprint before gate check.
  Fix 2: per-warp streak counter (max_streak=8) — after 8 consecutive
  gates, force-allow for one cycle and reset streak. Prevents deadlock
  when all active warps have footprint > 0.

cycle_direction_note: >
  Cycle increases (+2–4%) instead of decreasing. Same root cause as CCWS:
  tiny workload (64×64), few warps per SM, throttle blocks effective warps
  rather than reducing cache pressure. Mechanism is correct; larger workloads
  needed to see cycle reduction.

recommend_next: >
  AUTO-7 / Round 05: Focused validation with divergence-heavy workloads.
  Run 7 workloads × feature_off / conservative(threshold=32) / aggressive(threshold=16).
  Verify no deadlock. Document cycle direction and throttle_block signal.
  Consider larger workload sizes to see cycle reduction.

