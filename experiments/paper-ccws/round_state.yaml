current_gate_location: >
  scheduler_unit::cycle(), shader.cc:1356-1363.
  After checkCollision() (scoreboard check) passes.
  Inside the LOAD_OP/TENSOR_CORE_LOAD_OP branch.
  Only reached if warp is NOT in scoreboard stall.

scoreboard_interaction_summary: >
  High-LLS warps are typically in scoreboard stall (pending register writes
  from previous loads). checkCollision() returns true for these warps,
  causing them to exit the inner while loop before reaching the gate.
  Gate is never called for stalled warps regardless of LLS score.
  After gate blocks a warp (ccws_load_blocked=true), checked++ causes
  while condition (checked <= issued) to fail, so outer for continues
  to next warp — this part is correct behavior.

inc50_feedback_explanation: >
  inc=50 causes scores to accumulate so fast that non-stalled (low-LLS)
  warps also exceed the cutoff. wg_attempt jumps from ~16000 (inc=30)
  to 470559 (inc=50), a 28x increase. This means inc=50 gates warps
  that are NOT the high-LLS stall warps — it gates the wrong warps,
  causing +45-61% cycle increase (over-gating via feedback loop).

paper_can_issue_semantics: >
  CCWS paper: Can Issue bit cleared for warps exceeding LLS cutoff.
  Cleared warps are "not considered for load instruction issue" —
  meaning they are excluded at warp candidate selection, not after
  scoreboard check. A stalled warp that recovers should still be
  gated if its LLS is still high.

recommended_direction: B1
direction_comparison:
  A_inc50_higher_threshold:
    pros: no src change
    cons: >
      Does not fix root cause (gate position wrong).
      inc=50 gates wrong warps (non-stalled), not high-LLS stalled warps.
      Parameter rescue, not mechanism fix. Diverges further from paper.
  B1_pre_scoreboard_gate:
    pros: >
      Closest to paper Can Issue semantics.
      Minimal change (~10 lines, move existing gate call earlier).
      High-LLS warps gated after stall recovery.
      Non-load instructions unaffected.
    cons: >
      Requires src/ change.
      Need to re-validate feature_off 7/7 pass.
  C_accept_current:
    pros: no src change, fast path to standard validation
    cons: >
      inc=50 gating is not faithful CCWS reproduction.
      Standard set results may show cycle increase (not decrease).
      Cannot be used as evidence of correct CCWS behavior.

