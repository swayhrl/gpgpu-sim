root_cause_revised: >
  Gate position was NOT the root cause. The actual problem:
  would_can_issue is all-true for inc=5/20/30 because VTA hits are
  dispersed across too many warps. Per-warp LLS scores never exceed
  cutoff/nw (6400/64 = 100 per warp). The prefix sum never exceeds
  the cutoff, so would_can_issue[wid]=true for all warps.

  inc=20 srad_v2 diagnostic:
    max_score=413, sum_score=550736, nonzero_warps=128 (across 80 SMs)
    per-SM avg nonzero warps = 1.6
    per-SM cutoff = 6400
    prefix[0] = max_score = 413 << 6400 → would_can_issue all true

  inc=50 works because scores accumulate fast enough that some warps
  exceed cutoff/nw=100, making prefix sum exceed cutoff.
  But this gates non-stalled warps too → feedback loop → over-gating.

round_ae_hypothesis_status: incorrect
round_ae_hypothesis: >
  AE assumed high-LLS warps were stalled and couldn't reach the gate.
  AF shows the gate IS reached (lg_attempt=12416 for inc=20 srad_v2),
  but would_can_issue is all-true, so gate always returns allow.
  The stall hypothesis was a red herring.

recommend_next: >
  Three new directions:
  D) Lower lg_score_threshold to 1-10 so cutoff = nw*threshold is
     small enough for dispersed LLS scores to exceed it.
     Risk: threshold too low may gate all warps (deadlock if < base_score).
  E) Accept inc=50, raise threshold (150/200) to reduce over-gating.
     This is parameter tuning, not mechanism fix.
  F) Revisit VTA approximation: current intra-warp miss-side VTA
     disperses hits across many warps. Paper VTA (inter-warp eviction)
     concentrates signal on warps that lose locality to other warps.
     Implementing faithful eviction-based VTA may concentrate LLS scores.

