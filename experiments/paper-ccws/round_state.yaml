current_cutoff_basis: >
  nw = m_ccws_lls.size() = max_warps_per_shader = 64 (SM7_QV100).
  cum_cutoff = 64 * lg_score_threshold = 64 * 100 = 6400.
  All 64 warp slots included in sort+prefix-sum, including inactive slots.
  Inactive warp LLS = base_score = 100 (decay floor, never gets VTA hits).

suspected_bug: confirmed
bug_description: >
  cutoff uses max_warps_per_shader (64) instead of actual active warps (~8).
  Inactive warp base_score sum = 56 * 100 = 5600 = 87.5% of cutoff(6400).
  would_can_issue=false only falls on inactive warp slots (last in sorted order).
  Inactive warps never issue loads, so gate never triggers.

evidence_summary:
  occupancy_data:
    rodinia_srad_v2: "12.4% → ~8 active warps/SM"
    rodinia_hotspot: "12.3% → ~8 active warps/SM"
    polybench_fdtd2d: "11.6% → ~7 active warps/SM"
  lls_stats_inc20_srad_v2:
    max_score: 413
    sum_score: 584424  # across 80 SMs, ~7305/SM
    nonzero_warps: 256  # across 80 SMs, ~3.2/SM
    load_gate_attempt: 27193
    load_gate_block: 0
  prefix_sum_analysis:
    inactive_warps: 56
    inactive_base_score_sum: 5600
    cutoff: 6400
    active_prefix_max: "~1113 (8 warps × avg ~139)"
    conclusion: "prefix never exceeds 6400 within active warp range"
  why_inc50_works: >
    inc=50 makes active warp scores accumulate fast enough that
    prefix sum exceeds 6400 within the active warp range itself
    (not waiting for inactive warps). This gates active warps,
    but causes feedback loop → over-gating (+45-61% cycle).

paper_semantics:
  NumActiveWarps: "current active warps in SM (not max slots)"
  CumLLSCutoff: "NumActiveWarps × BaseScore"
  reference: "CCWS paper Section 3.3"

recommended_fix: >
  Replace nw = m_ccws_lls.size() with active warp count.
  Best source: m_core->get_not_completed() / m_config->warp_size
  (rounds up to avoid zero). Also restrict sort+prefix to active
  warp slots only (skip warp slots where done_exit() is true).
  Simpler alternative: only include warps with LLS > 0 in sort,
  but this may miss warps at base_score that are still active.

next_round_proposal: >
  Round AH: Fix cutoff calculation.
  1. In ldst_unit::cycle() would_can_issue update block:
     Replace: unsigned nw = m_ccws_lls.size();
     With: unsigned nw = (m_core->get_not_completed() +
                          m_config->warp_size - 1) / m_config->warp_size;
           if (nw == 0) nw = 1;
  2. In sort vector construction, skip done_exit() warp slots:
     Only add warp w to sv if !m_core->warp_done_exit(w).
  3. cum_cutoff = nw * lg_score_threshold (unchanged formula, but nw is now correct).
  4. Validate: feature_off 7/7 pass + inc=5/20/30 lg_block > 0 on srad_v2/fdtd2d.
  Expected: cutoff drops from 6400 to ~700-800; moderate gating signal.

