round: AH
stage: active_can_issue_revert
status: complete
date: 2026-05-01
branch: hrl/paper/ccws-repro-v0

source_changed: false  # shader.cc only has comment update; shader.h accessor reverted
experiments_run: true  # active_can_issue_validation.csv created (22 rows)

decision: revert
decision_rationale: >
  Active-warp cutoff (not_completed/warp_size) caused severe over-gating on tiny workloads.
  srad_v2 64x64 → ~2 warps/SM → cutoff=200 → 91% loads blocked (+64-767% cycle).
  Reverted to nw=max_warps_per_shader=64 with explanatory comment.
  Accepted as approximate implementation; tiny workloads not representative of paper HCS workloads.

current_implementation:
  vta: miss-side approximation (intra-warp repeated miss, not eviction-based)
  cutoff_basis: nw = max_warps_per_shader = 64 (over-estimates active warps 8x)
  cum_cutoff: 64 * lg_score_threshold = 6400 (default)
  gate_position: pre-scoreboard (Round AF)
  gating_signal: inc=50 produces gating but +45-61% cycle; inc=1/th=99 weak signal

validation_readiness:
  feature_off_quick: ready  # all rounds pass
  feature_on_quick_inc50: ready  # gating signal present, cycle impact expected
  feature_on_quick_inc1_th99: ready  # weak signal, no cycle impact
  standard_validation: limited  # tiny workloads insufficient; need larger workloads

new_files:
  - experiments/paper-ccws/active_can_issue_validation.csv
  - docs/papers/ccws_round_ah_active_can_issue.md (conclusion added)

next_step_options:
  - focused_validation_inc50: run 7 workloads with inc=50; document gating trend
  - focused_validation_inc1_th99: run 7 workloads with inc=1/th=99; verify no cycle impact
  - larger_workloads: build srad_v2 256x256 etc for more meaningful CCWS validation
