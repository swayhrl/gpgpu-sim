root_cause_confirmed: >
  Gate fires only when warp has LOAD_OP ready to issue.
  High-LLS warps are already stalled by scoreboard/memory system.
  They never reach the issue stage, so gate never triggers.
  inc=50 overcomes this via feedback loop (gates non-stalled warps too),
  but causes +45-61% cycle increase (over-gating).

sim_cycle_changes:
  all_inc5_20_30: 0  # no cycle change for any workload

recommend_next: >
  Three options:
  A) Accept inc=50, raise lg_score_threshold (150/200) to reduce over-gating.
  B) Move gate insertion point earlier in pipeline (warp selection, not issue stage)
     so high-LLS warps are gated even when recovering from stall.
  C) Accept current behavior; use inc=1/th=99 (hotspot 5 blocks) + inc=50
     (srad_v2/fdtd2d active gating) as evidence of working mechanism;
     proceed to standard set validation.

