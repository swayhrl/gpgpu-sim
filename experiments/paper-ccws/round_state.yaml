threshold_trend_summary: >
  th99 == th100 (5 blocks) > th101 (0 blocks). Monotone and correct.
  Boundary at cutoff 6400 (th100) vs 6464 (th101). hotspot LLS prefix
  sum falls in [6400, 6464) range at gate-check time.

signal_weakness_root_cause: >
  lls_hit_increment=1 causes slow score accumulation. Tiny workloads
  have few active warps. Most workloads spread VTA hits across many
  warps/cycles, so no single warp exceeds cutoff at any given cycle.

recommend_next: >
  Before standard validation, increase lls_hit_increment to 10-50 to
  amplify LLS score differentiation. This should cause more workloads
  to show gating and make threshold sweep more discriminating.
  Current mechanism is functionally correct.

